name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The npm package's dist/: the compiled plugin, the wallpaper API and its declarations.
      - run: bun run build

  # Lists the registered wallpapers, so the jobs below run one per wallpaper in parallel and pick up new ones.
  wallpapers:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: list
        run: echo "ids=$(bun -e 'import { WALLPAPERS } from "./wallpapers"; console.log(JSON.stringify(WALLPAPERS.map((w) => w.id)))')" >> "$GITHUB_OUTPUT"

  check:
    needs: wallpapers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wallpaper: ${{ fromJSON(needs.wallpapers.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # Fails on errors and flicker; the frame budget is generous because CI machines are slower and noisier.
      - run: bun dev/check.ts --quiet --max-ms=60 ${{ matrix.wallpaper }}

  screenshots:
    needs: wallpapers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wallpaper: ${{ fromJSON(needs.wallpapers.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun dev/screenshots.ts ${{ matrix.wallpaper }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-screenshots-${{ matrix.wallpaper }}
          path: dev/out/${{ matrix.wallpaper }}-*-45s.png
